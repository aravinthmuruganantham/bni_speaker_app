<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cf2030">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/theme.css">
<title>Edit Lineup</title>
<style>
  .row { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .row:first-child { border-top: 0; }
  .photo { position: relative; width: 64px; height: 64px; border-radius: 50%; border: 2px dashed #d3a2a8; background: var(--red-l); color: var(--red);
           display: grid; place-items: center; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; overflow: hidden; padding: 0; font-family: inherit; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fields input { margin-bottom: 6px; padding: 9px 11px; min-height: 42px; font-size: 15px; }
  .acts { display: flex; gap: 6px; align-items: center; }
  .acts .btn { min-height: 34px; padding: 0 10px; font-size: 14px; }
  .acts .idx { font-weight: 700; color: var(--mut); font-size: 13px; margin-right: auto; }
  .sticky { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, rgba(244,244,245,0)); padding: 16px 0 max(8px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .sticky .btn { flex: 1; }
  .count { font-size: 13px; color: var(--mut); margin-bottom: 8px; }
</style>
</head>
<body>
  <header class="bar">
    <img class="logo" src="/assets/logo.png" alt="" onerror="this.remove()">
    <h1>Edit Lineup</h1>
    <a class="back" href="/remote">Back to remote</a>
  </header>

  <div class="wrap">
    <div class="card">
      <h2>Paste a list</h2>
      <label for="paste">One speaker per line: Name, Category, Company</label>
      <textarea id="paste" placeholder="Ravi Kumar, Chartered Accountant, Kumar &amp; Co&#10;Meena S, Interior Designer, Meena Interiors"></textarea>
      <button class="btn small red" id="addPaste" style="margin-top:8px">Add to lineup</button>
      <p class="note">Commas, tabs or | all work. You can add photos below after pasting.</p>
    </div>

    <div class="card">
      <h2>Lineup (speaking order)</h2>
      <div class="count" id="count"></div>
      <div id="rows"></div>
      <button class="btn block" id="add" style="margin-top:8px">+ Add speaker</button>
    </div>

    <div class="sticky">
      <button class="btn red" id="save">Save lineup</button>
    </div>
    <p class="note" style="text-align:center">Photos are shrunk on your phone before upload (about 128 px).</p>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="toast"></div>

<script src="/js/app.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = App.esc;
  let rows = [];     // {id?, name, category, company, photoV, photo (new dataURL) | null, removePhoto}
  let dirty = false, pickIdx = -1;

  async function load() {
    try {
      const r = await App.admin('/api/data', { method: 'GET' });
      const j = await r.json();
      if (!j.ok) return App.toast(j.error || 'Could not load', true);
      rows = j.lineup.map(s => ({ id: s.id, name: s.name, category: s.category, company: s.company, photoV: s.photoV || 0, photo: null }));
      dirty = false; draw();
    } catch (e) { App.toast(e.message || 'Could not load', true); }
  }

  function draw() {
    const box = $('rows'); box.innerHTML = '';
    $('count').textContent = rows.length ? rows.length + ' speaker' + (rows.length === 1 ? '' : 's') : 'No speakers yet.';
    rows.forEach(function (s, i) {
      const el = document.createElement('div'); el.className = 'row';
      const src = s.photo ? s.photo : (s.photoV && s.id ? '/api/photo?id=' + encodeURIComponent(s.id) + '&v=' + s.photoV : '');
      el.innerHTML =
        '<button class="photo" type="button" aria-label="Choose photo">' + (src ? '<img alt="" src="' + esc(src) + '">' : 'Add<br>photo') + '</button>' +
        '<div class="fields">' +
          '<input type="text" placeholder="Name" value="' + esc(s.name) + '" data-k="name" autocomplete="off" autocapitalize="words">' +
          '<input type="text" placeholder="Category (e.g. Accountant)" value="' + esc(s.category) + '" data-k="category" autocomplete="off">' +
          '<input type="text" placeholder="Company" value="' + esc(s.company) + '" data-k="company" autocomplete="off">' +
          '<div class="acts"><span class="idx">#' + (i + 1) + '</span>' +
            (src ? '<button class="btn small" type="button" data-a="nophoto">Remove photo</button>' : '') +
            '<button class="btn small" type="button" data-a="up" aria-label="Move up">&uarr;</button>' +
            '<button class="btn small" type="button" data-a="down" aria-label="Move down">&darr;</button>' +
            '<button class="btn small ghost" type="button" data-a="del" aria-label="Delete">Delete</button></div>' +
        '</div>';
      el.querySelectorAll('input').forEach(inp => inp.oninput = () => { s[inp.dataset.k] = inp.value; dirty = true; });
      el.querySelector('.photo').onclick = () => { pickIdx = i; $('file').value = ''; $('file').click(); };
      el.querySelectorAll('[data-a]').forEach(b => b.onclick = function () {
        const a = b.dataset.a;
        if (a === 'up' && i > 0) rows.splice(i - 1, 0, rows.splice(i, 1)[0]);
        else if (a === 'down' && i < rows.length - 1) rows.splice(i + 1, 0, rows.splice(i, 1)[0]);
        else if (a === 'del') { if (!confirm('Remove ' + (s.name || 'this speaker') + '?')) return; rows.splice(i, 1); }
        else if (a === 'nophoto') { s.photo = null; s.photoV = 0; s.removePhoto = true; }
        else return;
        dirty = true; draw();
      });
      box.appendChild(el);
    });
  }

  // shrink + square-crop the photo on the phone (face-biased crop), JPEG ~6-10 KB
  function toJpeg(file, size) {
    return new Promise(function (res, rej) {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const x = c.getContext('2d'), s = Math.min(img.width, img.height);
        x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
        x.drawImage(img, (img.width - s) / 2, (img.height - s) * 0.25, s, s, 0, 0, size, size);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image')); };
      img.src = url;
    });
  }
  $('file').onchange = async function () {
    const f = this.files && this.files[0]; if (!f || pickIdx < 0) return;
    try { rows[pickIdx].photo = await toJpeg(f, 128); rows[pickIdx].removePhoto = false; dirty = true; draw(); }
    catch (e) { App.toast(e.message, true); }
  };

  $('add').onclick = () => { rows.push({ name: '', category: '', company: '', photoV: 0, photo: null }); dirty = true; draw(); window.scrollTo(0, document.body.scrollHeight); };
  $('addPaste').onclick = function () {
    const lines = $('paste').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) return App.toast('Paste at least one line', true);
    lines.forEach(function (l) {
      const p = l.split(/\t|\||,/).map(x => x.trim());
      rows.push({ name: p[0] || '', category: p[1] || '', company: p.slice(2).join(', '), photoV: 0, photo: null });
    });
    $('paste').value = ''; dirty = true; draw(); App.toast(lines.length + ' added');
  };

  $('save').onclick = async function () {
    const named = rows.filter(r => r.name.trim());
    if (!named.length && rows.length) return App.toast('Enter at least one name', true);
    const btn = this; btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const r = await App.admin('/api/lineup', { body: { speakers: named.map(s => ({
        id: s.id, name: s.name, category: s.category, company: s.company, photo: s.photo || undefined, removePhoto: s.removePhoto || undefined,
      })) } });
      const j = await r.json();
      if (!j.ok) App.toast(j.error || 'Save failed', true);
      else { App.toast('Lineup saved'); await load(); }
    } catch (e) { App.toast(e.message || 'Save failed', true); }
    btn.disabled = false; btn.textContent = 'Save lineup';
  };

  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  load();
})();
</script>
</body>
</html>
